<!-- PAGE 1 -->
<h1>Wait… don’t click yet 👀</h1>
<button onclick="nextPage()">Okay 😳</button>

<!-- PAGE 2 -->
<h1>I’ve been wanting to ask you something…</h1>
<button onclick="nextPage()">Tell me 💭</button>

<!-- PAGE 3 -->
<h1>Will you go out with me?</h1>

<button id="yesBtn" onclick="yes()">YES 💖</button>
<button id="noBtn" onmouseover="moveNo()">NO 😅</button>

<!-- PAGE 4 -->
<h1 style="display:none" id="final">
🎉 Yay! See you on Valentine’s 💕
</h1>

<script>
function moveNo() {
  const btn = document.getElementById("noBtn");
  btn.style.position = "absolute";
  btn.style.left = Math.random() * 80 + "%";
  btn.style.top = Math.random() * 80 + "%";
}

function yes() {
  document.body.innerHTML = "<h1>🎉 Yay! See you on Valentine’s 💕</h1>";
}
</script>
